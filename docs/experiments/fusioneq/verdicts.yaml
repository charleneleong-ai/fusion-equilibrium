# One entry per sweep, newest last; the dashboard and the W&B report render these.
# verdict: KEEP (kept for later work) / DISCARD / PROMOTE (shipped in a submission that set a new best).
# gate: G1 / G2 are defined in scripts/update_wandb_report.py (GATES).
- sweep: pre-sweep
  label: Baselines
  verdict: KEEP
  baseline: PCA 64 + ridge, S 0.822
  gate: first trained model above the linear baseline
  result: PCA 64 + ridge reaches S 0.822; the vacuum term is irrelevant for a linear model. A residual MLP jumps to 0.970.
  pr: 9
- sweep: v1_mlp
  label: Context, vacuum, capacity
  verdict: KEEP
  baseline: residual MLP 1024x4, S 0.970
  gate: G1
  result: Temporal context and the vacuum term are both within noise. The wide 2048x6 net needs 25 epochs to pay off (0.9794
    best).
  pr: 12
- sweep: v2_batch
  label: Large batches
  verdict: DISCARD
  baseline: batch 2048 (v1 best 0.9794)
  gate: G1
  result: Falsified and cut after 2 of 5 iters. Batch 8192 fell to 0.684 (fp32) and 0.915 (bf16); bf16 trains 4.5x faster.
  pr: 12
- sweep: v3_long_bf16
  label: bf16 and longer training
  verdict: KEEP
  baseline: v1 best 0.9794
  gate: G1
  result: Epochs are the lever up to 60 (0.9762 at 25, 0.9873 at 60), then a plateau near 0.987 across depth 10, PCA 256,
    80 epochs and batch 4096. Best 0.9875 (2048x10).
  pr: 12
- sweep: v4_pixel_loss
  label: Pixel-space loss
  verdict: DISCARD
  baseline: v3 best 0.9875
  gate: G1
  result: Variance-weighting the PCA loss nearly perfects psi (R2 0.9997) but costs the shape scalars, Z_axis worst. Best
    0.9865, below v3. Two runs lost to a false GPU-memory kill.
  pr: 12
- sweep: v5_loss_mix
  label: Blended loss, longer training
  verdict: PROMOTE
  baseline: v3 best 0.9875
  gate: G1; then the first Codabench entry (official 0.9905)
  result: A 50/50 blend of the standard and pixel losses keeps the flux accuracy and lifts the shape scalars. With depth 10
    and 120 epochs it reaches 0.9915 (a lucky seed; v6 measured single-model noise at about 0.0013).
  pr: 12
- sweep: v6_ensemble_region
  label: Seed ensembles, envelope loss
  verdict: PROMOTE
  baseline: v5 single model 0.9915
  gate: G1; official 0.99164 (3 seeds), 0.99201 (5 models)
  result: Seeds 1 and 2 of the v5 winner score 0.9901-0.9902, so single-model noise is about 0.0013. The envelope-region loss
    is within that noise. Ensembles lift every shape scalar - 3 seeds 0.9922 (official 0.9916, rank 29), 5 models 0.9926.
  pr: 12
- sweep: v7_thomson_hr
  label: Full-resolution Thomson inputs
  verdict: DISCARD
  baseline: v6 3-seed ensemble 0.9922
  gate: G1
  result: One station per chord with the samples averaged over each 20 ms frame is worse on all three seeds (-0.0033, -0.0013,
    -0.0007) and li falls on every one. The 3-seed ensemble 0.9909 loses to the standard 0.9922, and the extra members drag
    the 6-model mix (0.9924) below the 5-model best (0.9926).
  pr: 12
- sweep: v8_ensemble_seeds
  label: Seven- and nine-model ensembles
  verdict: PROMOTE
  baseline: v6 5-model ensemble 0.9926
  gate: G1; official 0.99217
  result: Two more seeds and two more region-loss runs lift the mean to 0.9927 (7 models) and 0.9928 (9 models), consistency
    0.9727; each doubling now adds about 0.0002. Choosing members or taking the median on never-scored shots does worse on
    the scoring shots (top-5 mean 0.9925), since member differences are shot noise.
  pr: 12
- sweep: v9_ensemble_more
  label: Thirteen- and seventeen-model ensembles
  verdict: DISCARD
  baseline: v8 9-model ensemble 0.99277
  gate: G1
  result: Eight more members (0.9885-0.9905 each) no longer move the mean - 13 models 0.99277, 17 models 0.99272 against the
    9-model 0.99277. Averaging has saturated.
  pr: 12
- sweep: v10_history
  label: Shot-history features
  verdict: DISCARD
  baseline: v8 members on matched seeds
  gate: G1
  result: Time in the shot, past |Ip| means, its ramp and past core Te leave S flat on two seed-matched pairs (-0.0001) and
    lower on the lucky seed 0 (-0.0039); li rises on two seeds (+0.005, +0.011) but kappa does not. The model family is at
    its plateau.
  pr: 15
- sweep: v11_spare_holdout
  label: Training on the never-scored held-out shots
  verdict: DISCARD
  baseline: v8 9-model ensemble 0.99277
  gate: G1
  result: Retraining v8's nine members with the 160 never-scored held-out shots moves members -0.0004 on average (inside seed
    noise) and the 9-model mean to 0.99260 against 0.99277; the model is not data-limited. Mixing both sets (18 models) scores
    0.99283, within noise of v8.
  pr: 17
- sweep: v12_temporal
  label: Whole-shot temporal model
  verdict: DISCARD
  baseline: v8 3-seed mean 0.99223
  gate: G1
  result: Dilated convolutions over the whole shot after the per-frame MLP lose on every seed-matched pair (-0.0065 / -0.0035
    / -0.0054) and the 3-seed mean (0.98874 vs 0.99223); every consistency term falls. Windows of correlated frames give fewer
    independent samples per step. Off by default.
  pr: 20
- sweep: v13_capacity
  label: Wider and longer members
  verdict: DISCARD
  baseline: 2048 x 120 members on the same seeds, 0.99081
  gate: G1
  result: 4096-wide (0.98826 on two seeds), 240-epoch (0.98955) and both (0.98929, one seed) members all lose to the 2048
    x 120 config on the same seeds (0.99081); consistency and kappa fall. Extra capacity fits the training shots, not the
    shape scalars.
  pr: 22
- sweep: v14_ramp
  label: Ramp-weighted members
  verdict: PROMOTE
  baseline: v8 base (official 0.992317 with trees)
  gate: G2
  result: Weighting ramp-up / ramp-down frames 2x or 4x weakens single members (-0.0007 to -0.0008 on matched seeds) but they
    are diverse - six lift v8's validation S +0.00044 against +0.00007 for six plain members; officially +0.00002 (0.992341).
  pr: 23
- sweep: v15_ramp_more
  label: More ramp-weighted members
  verdict: DISCARD
  baseline: v14 six ramp-weighted members
  gate: G2
  result: Six more ramp-weighted members lower the ensemble (-0.00035 on validation); the ramp direction stops.
  pr: 24
- sweep: v16_normalize
  label: Shape-only flux target
  verdict: PROMOTE
  baseline: f4205360 base (official 0.992341)
  gate: G2
  result: Predicting the flux shape (centred / scaled in the envelope) plus its mean and spread lifts consistency (+0.0023
    on the 3-seed mean) but loses R2psi; as a hybrid blend (normalized shape, base level and spread) it lifts both held-out
    sets (+0.00029 / +0.00049).
  pr: 24
- sweep: v17_normalize_more
  label: More shape-target members
  verdict: PROMOTE
  baseline: three shape-target members (official 0.992663)
  gate: G2
  result: Six shape-target members beat three in the hybrid (validation 0.992194 vs 0.992072, scoring 0.993408 vs 0.993242)
    and the best weight rises to 0.5; seed 5 is the best single member yet (0.99184).
  pr: 24
- sweep: v18_normalize_six
  label: Twelve shape-target members
  verdict: PROMOTE
  baseline: six shape-target members (official 0.99283)
  gate: G2
  result: Twelve members beat six in the hybrid (validation 0.992421 vs 0.992194, scoring 0.993566 vs 0.993408) and the best
    weight rises to 0.65; officially 0.992904 (+0.00007). Single members stay at 0.9897-0.9918.
  pr: 24
- sweep: v19_normalize_variants
  label: Shape-target variants (PCA size, context)
  verdict: PROMOTE
  baseline: twelve shape-target members (official 0.992904)
  gate: G2
  result: PCA 128 / 256 and context 6 / 2 members (0.9900-0.9917) each lift the twelve-member hybrid on both sets; all six
    add +0.00013 validation (0.992556) and +0.00017 scoring.
  pr: 24
- sweep: v20_normalize_ramp
  label: Ramp-weighted shape-target members
  verdict: PROMOTE
  baseline: v19 blend (21 members, official 0.993078)
  gate: G2
  result: Shape target plus ramp weight 2 (0.9901-0.9915) adds +0.00007 validation to 12 members and +0.00003 on top of v19.
    With 0.1 x trees on the shape target, the 21-member blend (validation 0.992633) scored 0.993078 officially (+0.00017).
  pr: 24
- sweep: v21_normalize_seeds
  label: 27 shape-target members
  verdict: KEEP
  baseline: 21-member blend 7a56d52a (official 0.993078)
  gate: G2
  result: Six more seeds (0.9899-0.9919; seed 40 the best member yet) lift the blend +0.00007 on both local sets (validation
    0.992713) but officially 0.993074 against 0.993078. More members of this family no longer transfer; gains under ~0.0001
    are noise on 40 + 40 shots.
  pr: 24
- sweep: blend
  label: Blends chosen on 160 held-out shots
  verdict: PROMOTE
  baseline: 7a56d52a (official 0.993078)
  gate: G2
  result: Fixed-weight blends of the MLP base, coefficient trees, the shape-target hybrid, shape trees and grid models (configs/blends/*.yaml).
    Weights are chosen on 160 never-scored shots and must win in most 40-shot groups. Officially 0.993078 (7a56d52a) -> 0.993114
    (trees on 2x data) -> 0.993927 (three grid models, 07cfd3ff).
  pr: 26
- sweep: grid
  label: Grid U-Net shape model
  verdict: PROMOTE
  baseline: 12068a0d, no grid (official 0.993114)
  gate: G2
  result: A FiLM U-Net predicting the 65x65 flux shape from the vacuum-flux map, R/Z maps and features. Validation envelope
    loss 0.00105 (32 channels) -> 0.00075 (48) -> 0.00064 (64). In the blend it lifted the official score by +0.00081 over
    four submissions, mostly through consistency (0.9750 -> 0.9788). A Grad-Shafranov loss (weight 50) hurt (val loss 0.0031)
    and is closed.
  pr: 26
- sweep: grid_v2_gs
  label: Grad-Shafranov loss on the grid model
  verdict: DISCARD
  baseline: H 07cfd3ff on 160 shots (0.993914)
  gate: G2
  result: Weight 50 raises the validation envelope loss to 0.0031 (grid_v2 0.00075); as an extra grid, a replacement or alone
    it loses to H on 160 shots (0.993827 / 0.993863 / 0.992890). Closed unless retried at weight 5 or less.
  pr: 26
- sweep: gs_free
  label: Free-boundary Grad-Shafranov for MAST shape
  verdict: DISCARD
  baseline: physics flux (vacuum + Thomson ellipse), DIII-D S 0.5013, consistency 0
  gate: consistency above 0 on held-out DIII-D (labels allowed) before any MAST use
  result: 'Pinned centroid: S 0.5035, consistency 0, scalar R2 -9 (R_axis) / -11 (kappa); free centroid: S 0.392, R_axis -37.
    The solve cannot track shape without magnetics or vessel currents. Closed.'
  pr: 26
- sweep: blend_w75
