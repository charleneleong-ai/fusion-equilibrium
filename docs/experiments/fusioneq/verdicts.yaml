  verdict: DISCARD
  baseline: base q95/betaN of the w75 blend on the 200 held-out shots (R2_qb ~0.996)
  gate: dS > 0 on the 40 clean scoring shots (shrink chosen on the four other groups before looking)
  result: 'XGBoost residuals on scorer-derived geometry, a Thomson stored-energy proxy and textbook q95/betaN priors,
    cross-fitted over five 40-shot groups: +1e-6 to +2e-6 S on the non-scoring groups and -0.000005 on the scoring
    group at the chosen shrink 0.5. The geometry adds nothing the base scalars lack. Code stays on
    feat/fusion-eq-qb-stack (52a7127). Closed.'
  pr: 26
