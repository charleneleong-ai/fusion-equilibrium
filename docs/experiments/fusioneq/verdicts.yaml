  verdict: DISCARD
  baseline: H 07cfd3ff on 160 shots (0.993914); official 0.993927
  gate: G2
  result: 'Won all five 40-shot groups on 160 shots (0.994000, +0.000086) but did not transfer: official f10440d6 0.993924
    (-0.000003; D_LCFS 0.011025 -> 0.011121). Another sub-1e-4 local gain that did not survive the public test.'
  pr: 26
- sweep: mast_geometry_freegs
  label: MAST coil geometry vs FreeGS MAST() (lever 4)
  verdict: DISCARD
  baseline: label-free MAST 4c428222 (R2psi 0.908)
  gate: a geometry-only fix that explains the solenoid-tracking flux level, with no constant chosen by scores (rule 3)
  result: 'Our shipped FAIR-MAST geometry (656-turn, 4-layer solenoid; multi-turn PF coils) is the more detailed description; PF
    coils agree within 1-5%. FreeGS''s solenoid radius sits inside our layer span, so it gives no direction; at most ~0.006 Wb/rad
    of the 0.022 per-frame level std from geometry. Closed.'
  pr: 26
- sweep: qb_stack
