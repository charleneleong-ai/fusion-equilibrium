[project]
name = "fusioneq"
version = "0.1.0"
description = "NeurIPS 2026 Fusion Equilibrium Challenge entry: Green's-function vacuum flux plus a learned plasma term"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "joblib>=1.3",
    "torch>=2.2",
    "typer>=0.12",
    "loguru>=0.7",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "wandb>=0.17",
    "wandb-workspaces>=0.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "autoresearch[wandb] @ git+https://github.com/charleneleong-ai/autoresearch.git@d016420aeaebd67df29e69e30da86094c6fbf7db",
    "xgboost>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fusioneq", "experiments"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0915"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.pylint]
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS Accelerate raises spurious FP flags in matmul (numpy>=2 + sklearn PCA); values are unaffected.
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
