# Single-FNO alternative to v21_16_grids3_fno2 (docs/final-budget.md, 14 Oct): v21_16_grids3 with grid_v2 swapped for the FNO grid
# grid_fno and grids at 0.75, which leaves the one shape MLP only as the shape-tree host (hybrid share 0).
# 16 MLPs + 2 forests + 3 grids, 14.7-18.3 idle A100-h. 160 never-scored shots 0.994255 (07cfd3ff 0.993914,
# a4b4092c 0.994126); per 40-shot group vs 07cfd3ff +180 / +112 / +708 / +338 / +61 x 1e-6 (spare thirds,
# validation, scoring). Grid set and weight chosen post hoc on those 160 shots; whether the FNO belongs at all
# rests on a4b4092c's official score.
base: [v5_loss_mix_i03,
       v6_ensemble_region_i00, v6_ensemble_region_i01, v6_ensemble_region_i02, v6_ensemble_region_i03,
       v8_ensemble_seeds_i00, v8_ensemble_seeds_i01, v8_ensemble_seeds_i02, v8_ensemble_seeds_i03,
       v14_ramp_i00, v14_ramp_i01, v14_ramp_i02, v14_ramp_i03, v14_ramp_i04, v14_ramp_i05]
trees: {host: v5_loss_mix_i03, model: xgb_top32_full.json, weight: 0.1, stride: 1}
shape: [v21_normalize_seeds_i00]
hybrid_weight: 0.75
shape_trees: {host: v21_normalize_seeds_i00, model: xgb_shape_v21s40_top32_full.json, weight: 0.15, stride: 1}
grid: {models: [grid_v2_s1, grid_v3, grid_fno], weight: 0.75}
