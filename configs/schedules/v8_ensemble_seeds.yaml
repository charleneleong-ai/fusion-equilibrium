# v8: the 5-model v6 ensemble scored 0.99201 officially (local 0.99258), +0.0004 over the 3-seed ensemble, with
# consistency still the gap to the 0.9963 leader. Averaging more independent members is the one lever that has
# transferred; v6 showed seed and region-loss members are equally useful, so add two of each, then ensemble 7 and 9.
command: train
common_overrides: [--holdout, 200, --score-shots, 40, --amp, --context, 4, --batch, 2048, --lr, 1e-3, --n-components, 192, --hidden, 2048, --layers, 10, --epochs, 120, --coef-loss, mix]
iters:
  - description: "v5 best config, seed 3 (ensemble member)"
    overrides: [--seed, 3]
  - description: "v5 best config, seed 4 (ensemble member)"
    overrides: [--seed, 4]
  - description: "envelope region loss, weight 1, seed 1"
    overrides: [--region-weight, 1.0, --seed, 1]
  - description: "envelope region loss, weight 3, seed 1"
    overrides: [--region-weight, 3.0, --seed, 1]
  - description: "7-model ensemble: v6's five + seeds 3, 4"
    command: ensemble
    overrides: [--members, "v5_loss_mix_i03,v6_ensemble_region_i00,v6_ensemble_region_i01,v6_ensemble_region_i02,v6_ensemble_region_i03,v8_ensemble_seeds_i00,v8_ensemble_seeds_i01"]
    timeout_min: 30
  - description: "9-model ensemble: v6's five + all four v8 members"
    command: ensemble
    overrides: [--members, "v5_loss_mix_i03,v6_ensemble_region_i00,v6_ensemble_region_i01,v6_ensemble_region_i02,v6_ensemble_region_i03,v8_ensemble_seeds_i00,v8_ensemble_seeds_i01,v8_ensemble_seeds_i02,v8_ensemble_seeds_i03"]
    timeout_min: 30
