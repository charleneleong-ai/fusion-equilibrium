# v9: the v8 9-model mean scored 0.99217 officially (rank 26; local 0.99277), +0.00016 over 5 models; each doubling of
# members now adds ~0.0002. Overnight, add eight more members (four seeds of the base config, two of each region-loss
# weight) and ensemble 13 and 17. Losses (region, gradient/current, linearised consistency) did not help; members did.
command: train
common_overrides: [--holdout, 200, --score-shots, 40, --amp, --context, 4, --batch, 2048, --lr, 1e-3, --n-components, 192, --hidden, 2048, --layers, 10, --epochs, 120, --coef-loss, mix]
iters:
  - description: "v5 best config, seed 5"
    overrides: [--seed, 5]
  - description: "v5 best config, seed 6"
    overrides: [--seed, 6]
  - description: "v5 best config, seed 7"
    overrides: [--seed, 7]
  - description: "v5 best config, seed 8"
    overrides: [--seed, 8]
  - description: "envelope region loss, weight 1, seed 2"
    overrides: [--region-weight, 1.0, --seed, 2]
  - description: "envelope region loss, weight 1, seed 3"
    overrides: [--region-weight, 1.0, --seed, 3]
  - description: "envelope region loss, weight 3, seed 2"
    overrides: [--region-weight, 3.0, --seed, 2]
  - description: "envelope region loss, weight 3, seed 3"
    overrides: [--region-weight, 3.0, --seed, 3]
  - description: "13-model ensemble: v8's nine + seeds 5-8"
    command: ensemble
    overrides: [--members, "v5_loss_mix_i03,v6_ensemble_region_i00,v6_ensemble_region_i01,v6_ensemble_region_i02,v6_ensemble_region_i03,v8_ensemble_seeds_i00,v8_ensemble_seeds_i01,v8_ensemble_seeds_i02,v8_ensemble_seeds_i03,v9_ensemble_more_i00,v9_ensemble_more_i01,v9_ensemble_more_i02,v9_ensemble_more_i03"]
    timeout_min: 45
  - description: "17-model ensemble: all members"
    command: ensemble
    overrides: [--members, "v5_loss_mix_i03,v6_ensemble_region_i00,v6_ensemble_region_i01,v6_ensemble_region_i02,v6_ensemble_region_i03,v8_ensemble_seeds_i00,v8_ensemble_seeds_i01,v8_ensemble_seeds_i02,v8_ensemble_seeds_i03,v9_ensemble_more_i00,v9_ensemble_more_i01,v9_ensemble_more_i02,v9_ensemble_more_i03,v9_ensemble_more_i04,v9_ensemble_more_i05,v9_ensemble_more_i06,v9_ensemble_more_i07"]
    timeout_min: 60
