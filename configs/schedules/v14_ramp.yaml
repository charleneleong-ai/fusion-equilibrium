# v14: the consistency error is concentrated - the worst 1% of held-out frames hold 27-57% of each term's error (li
# 57%), mostly ramp-up / ramp-down at low current and high li (docs/diii-d-diagnosis.md). Weight those frames
# (cache.ramp_frames, ~27% of frames) 2x and 4x in the loss, three seeds each, against the same seeds unweighted
# (v5_loss_mix_i03 0.99148, v6_ensemble_region_i00 / i01 0.99014 / 0.99019; mean 0.99060). Falsified if li, Z_axis and
# volume do not rise on the seed-matched pairs.
command: train
common_overrides: [--holdout, 200, --score-shots, 40, --amp, --context, 4, --batch, 2048, --lr, 1e-3, --n-components, 192, --hidden, 2048, --layers, 10, --epochs, 120, --coef-loss, mix]
iters:
  - {description: "ramp weight 2, seed 0 (pair: v5_loss_mix_i03)", overrides: [--ramp-weight, 2.0, --seed, 0]}
  - {description: "ramp weight 2, seed 1 (pair: v6_ensemble_region_i00)", overrides: [--ramp-weight, 2.0, --seed, 1]}
  - {description: "ramp weight 2, seed 2 (pair: v6_ensemble_region_i01)", overrides: [--ramp-weight, 2.0, --seed, 2]}
  - {description: "ramp weight 4, seed 0 (pair: v5_loss_mix_i03)", overrides: [--ramp-weight, 4.0, --seed, 0]}
  - {description: "ramp weight 4, seed 1 (pair: v6_ensemble_region_i00)", overrides: [--ramp-weight, 4.0, --seed, 1]}
  - {description: "ramp weight 4, seed 2 (pair: v6_ensemble_region_i01)", overrides: [--ramp-weight, 4.0, --seed, 2]}
